<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="lungGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#181c22" />
      <stop offset="70%" stop-color="#0a0c0e" />
      <stop offset="100%" stop-color="#040506" />
    </radialGradient>

    <!-- Lung Cavity Shade -->
    <radialGradient id="lungFieldR" cx="40%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#050608" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#12151a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2a303a" stop-opacity="0.4" />
    </radialGradient>
    <radialGradient id="lungFieldL" cx="60%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#050608" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#12151a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2a303a" stop-opacity="0.4" />
    </radialGradient>

    <!-- Infiltrate / Consolidation Opacity Texture -->
    <radialGradient id="consolidationOp" cx="38%" cy="66%" r="20%">
      <stop offset="0%" stop-color="#e8ecf2" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#bdc5d1" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#8a94a6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#181c22" stop-opacity="0" />
    </radialGradient>

    <!-- Cardiac Shadow -->
    <radialGradient id="heartShadow" cx="54%" cy="58%" r="30%">
      <stop offset="0%" stop-color="#d9dee8" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#8c96a8" stop-opacity="0.65" />
      <stop offset="90%" stop-color="#3b4250" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#141820" stop-opacity="0" />
    </radialGradient>

    <!-- Spine Shadow -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222832" stop-opacity="0.2" />
      <stop offset="35%" stop-color="#a4b0c2" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#dfe5f0" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#a4b0c2" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#222832" stop-opacity="0.2" />
    </linearGradient>

    <!-- GRAD-CAM THERMAL HEATMAP MULTI-STOP RADIAL GRADIENT -->
    <radialGradient id="gradcamHeatmap" cx="38%" cy="64%" r="24%">
      <stop offset="0%" stop-color="#ff0022" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#ff3b00" stop-opacity="0.82" />
      <stop offset="55%" stop-color="#ff8c00" stop-opacity="0.7" />
      <stop offset="75%" stop-color="#ffd000" stop-opacity="0.5" />
      <stop offset="88%" stop-color="#73e600" stop-opacity="0.25" />
      <stop offset="96%" stop-color="#00bcd4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0" />
    </radialGradient>

    <!-- Secondary Mild Activation Zone -->
    <radialGradient id="gradcamHeatmapSecondary" cx="34%" cy="48%" r="16%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ffdd00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00bcd4" stop-opacity="0" />
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <filter id="heatmapGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Deep Black Background -->
  <rect width="800" height="800" fill="url(#lungGlow)" />

  <!-- Thoracic Silhouette Outer Soft Border -->
  <path d="M 230,120 Q 400,100 570,120 Q 670,220 680,480 Q 690,620 610,690 Q 400,740 190,690 Q 110,620 120,480 Q 130,220 230,120 Z" fill="#1b2028" opacity="0.35" filter="url(#softGlow)" />

  <!-- Trachea / Air Column -->
  <rect x="388" y="90" width="24" height="150" rx="6" fill="#080a0d" opacity="0.9" />

  <!-- Right & Left Lung Cavities -->
  <path d="M 370,150 C 310,140 230,190 195,270 C 165,340 160,430 170,540 C 180,600 205,640 240,655 C 290,670 345,630 370,590 Z" fill="url(#lungFieldR)" />
  <path d="M 430,150 C 490,140 570,190 605,270 C 635,340 640,430 630,540 C 620,605 580,650 540,655 C 475,665 440,620 430,560 Z" fill="url(#lungFieldL)" />

  <!-- Spine / Vertebral Column -->
  <rect x="375" y="100" width="50" height="580" fill="url(#spineGrad)" opacity="0.55" rx="4" />
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.3">
    <line x1="380" y1="170" x2="420" y2="170" /><line x1="380" y1="205" x2="420" y2="205" />
    <line x1="380" y1="240" x2="420" y2="240" /><line x1="380" y1="275" x2="420" y2="275" />
    <line x1="380" y1="310" x2="420" y2="310" /><line x1="380" y1="345" x2="420" y2="345" />
    <line x1="380" y1="380" x2="420" y2="380" /><line x1="380" y1="415" x2="420" y2="415" />
    <line x1="380" y1="450" x2="420" y2="450" /><line x1="380" y1="485" x2="420" y2="485" />
    <line x1="380" y1="520" x2="420" y2="520" /><line x1="380" y1="555" x2="420" y2="555" />
    <line x1="380" y1="590" x2="420" y2="590" /><line x1="380" y1="625" x2="420" y2="625" />
  </g>

  <!-- Clavicles -->
  <g stroke="#cfd7e6" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.75" filter="url(#blurFilter)">
    <path d="M 385,150 Q 280,140 180,165" />
    <path d="M 415,150 Q 520,140 620,165" />
  </g>

  <!-- Rib Cage Arcs -->
  <g stroke="#9ab0cc" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.38" filter="url(#blurFilter)">
    <path d="M 380,210 Q 260,200 175,260" />
    <path d="M 380,250 Q 250,240 165,310" />
    <path d="M 380,295 Q 240,285 160,365" />
    <path d="M 380,345 Q 235,335 160,425" />
    <path d="M 380,400 Q 235,390 165,490" />
    <path d="M 380,460 Q 240,450 175,550" />
    <path d="M 380,520 Q 250,510 195,605" />
    <path d="M 380,580 Q 270,570 230,640" />

    <path d="M 420,210 Q 540,200 625,260" />
    <path d="M 420,250 Q 550,240 635,310" />
    <path d="M 420,295 Q 560,285 640,365" />
    <path d="M 420,345 Q 565,335 640,425" />
    <path d="M 420,400 Q 565,390 635,490" />
    <path d="M 420,460 Q 560,450 625,550" />
    <path d="M 420,520 Q 550,510 605,605" />
    <path d="M 420,580 Q 530,570 570,640" />
  </g>

  <!-- Bronchovascular Markings -->
  <g stroke="#bccae0" stroke-width="2.5" fill="none" opacity="0.32" stroke-linecap="round">
    <path d="M 360,330 Q 300,310 240,280" />
    <path d="M 360,340 Q 280,350 220,380" />
    <path d="M 360,360 Q 290,410 240,470" />
    <path d="M 360,370 Q 310,460 290,540" />
    <path d="M 440,340 Q 500,310 560,270" />
    <path d="M 440,350 Q 520,360 580,390" />
    <path d="M 440,370 Q 510,420 560,480" />
    <path d="M 440,380 Q 490,460 510,540" />
  </g>

  <!-- Cardiac Silhouette -->
  <path d="M 400,240 C 435,245 455,270 450,295 C 445,315 435,325 435,340 C 435,360 480,410 510,480 C 535,535 520,585 470,610 C 430,625 385,610 360,590 C 340,540 345,460 365,380 C 375,340 375,290 385,250 Z" fill="url(#heartShadow)" filter="url(#blurFilter)" />

  <!-- Diaphragms -->
  <path d="M 160,570 C 200,530 290,520 380,560 L 380,680 L 160,680 Z" fill="#b0bccd" opacity="0.7" filter="url(#blurFilter)" />
  <path d="M 420,570 C 480,540 560,550 630,595 L 630,680 L 420,680 Z" fill="#9eacbf" opacity="0.65" filter="url(#blurFilter)" />

  <!-- Underlying Infiltrate -->
  <ellipse cx="305" cy="510" rx="95" ry="75" fill="url(#consolidationOp)" filter="url(#blurFilter)" />
  <circle cx="280" cy="530" r="55" fill="#f0f4fa" opacity="0.45" filter="url(#blurFilter)" />

  <!-- GRAD-CAM ACTIVATION HEATMAP OVERLAY LAYER -->
  <g class="gradcam-layer" filter="url(#heatmapGlow)">
    <circle cx="270" cy="400" r="85" fill="url(#gradcamHeatmapSecondary)" />
    <circle cx="305" cy="510" r="145" fill="url(#gradcamHeatmap)" />
  </g>

  <!-- ROI BOUNDING BOX (LÓBULO INFERIOR DERECHO) -->
  <g class="roi-layer">
    <!-- Outer highlighted border -->
    <rect x="200" y="390" width="190" height="210" rx="8" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.9" />
    
    <!-- Corner Crosshairs -->
    <g stroke="#ffffff" stroke-width="2" opacity="0.95">
      <path d="M 195,405 L 195,385 L 215,385" fill="none" />
      <path d="M 375,385 L 395,385 L 395,405" fill="none" />
      <path d="M 195,585 L 195,605 L 215,605" fill="none" />
      <path d="M 375,605 L 395,605 L 395,585" fill="none" />
    </g>

    <!-- Center Label in ROI -->
    <g transform="translate(205, 395)">
      <rect x="0" y="0" width="180" height="42" rx="6" fill="#b91c1c" opacity="0.92" />
      <text x="90" y="19" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Lóbulo inf. der.</text>
      <text x="90" y="34" fill="#fee2e2" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">94.2%</text>
    </g>

    <!-- Top Right Active Focus Badge -->
    <g transform="translate(635, 35)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#dc2626" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#fef2f2" />
      <text x="70" y="19" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Foco activo</text>
    </g>
  </g>

  <!-- Technical Annotations -->
  <g fill="#e2e8f0" font-family="'SF Mono', 'Roboto Mono', 'Courier New', monospace" font-size="13" opacity="0.88">
    <text x="32" y="44" font-weight="700">Inferencia neuronal &amp; Grad-CAM</text>
    <text x="32" y="66" fill="#f87171" font-weight="600">CAPA DE ATENCIÓN: CONV5_BLOCK3</text>
  </g>

  <g fill="#94a3b8" font-family="'SF Mono', 'Roboto Mono', 'Courier New', monospace" font-size="12" opacity="0.85">
    <text x="32" y="760">ACTIVACIÓN MÁXIMA: 0.942 [PNEUMONIA]</text>
  </g>

  <g fill="#e2e8f0" font-family="'SF Mono', 'Roboto Mono', 'Courier New', monospace" font-size="14" text-anchor="end" opacity="0.92">
    <rect x="670" y="738" width="98" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="758" y="758" font-weight="700" fill="#f8fafc">R (DERECHA)</text>
  </g>
</svg>
